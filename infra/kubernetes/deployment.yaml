apiVersion: v1
kind: Namespace
metadata:
  name: industrial-ai
  labels:
    app.kubernetes.io/part-of: ge-industrial-iot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ge-predictive-maintenance-app
  namespace: industrial-ai
  labels:
    app.kubernetes.io/name: predictive-maintenance
    app.kubernetes.io/part-of: ge-industrial-iot
spec:
  replicas: 3
  selector:
    matchLabels:
      app: predictive-maintenance
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: predictive-maintenance
    spec:
      containers:
        - name: inference-engine
          image: ge-registry.internal/predictive-maintenance:v2.4.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ge-predictive-maintenance-svc
  namespace: industrial-ai
spec:
  type: ClusterIP
  selector:
    app: predictive-maintenance
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ge-predictive-maintenance-hpa
  namespace: industrial-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ge-predictive-maintenance-app
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
