[project]
name = "predictive-maintenance-application"
version = "0.1.0"
description = "Predictive maintenance demonstration API and operations dashboard"
readme = "README.md"
authors = [
    { name = "pratikjawale-codes", email = "psjawale79@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.8,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
